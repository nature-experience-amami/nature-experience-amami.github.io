<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10251b">
  <title>Nature Experience Amami｜予約管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <h1>Nature Experience Amami</h1>
    <p>問い合わせ・予約管理</p>
  </div>
  <div class="actions" style="margin:0">
    <button id="newScheduleBtn" class="ghost">＋ 予定を追加</button>
    <button id="newBtn" class="primary">＋ 新規問い合わせ</button>
  </div>
</header>

<main>
  <section class="stats">
    <div class="stat"><span id="allCount">0</span><small>全件</small></div>
    <div class="stat"><span id="pendingCount">0</span><small>未確定</small></div>
    <div class="stat"><span id="confirmedCount">0</span><small>予約確定</small></div>
  </section>

  <section class="actions" style="margin-top:0">
    <button id="backupBtn" class="ghost">⬇ バックアップ</button>
    <button id="restoreBtn" class="ghost">⬆ 復元</button>
    <input type="file" id="restoreFile" accept="application/json" hidden>
  </section>

  <section class="toolbar">
    <input id="search" type="search" placeholder="氏名・ホテル・生き物で検索">
    <select id="statusFilter">
      <option value="all">すべて</option>
      <option value="pending">未確定</option>
      <option value="confirmed">予約確定</option>
      <option value="personal">自分の予定</option>
    </select>
  </section>

  <section id="list" class="cards"></section>

  <section id="scheduleEditor" class="panel hidden">
    <div class="panel-head">
      <h2>予定を追加</h2>
      <button id="closeScheduleEditor" class="ghost">閉じる</button>
    </div>
    <label>日付<input id="scheduleDate" type="date"></label>
    <label>内容<textarea id="scheduleNotes" rows="3" placeholder="歯医者、法事、他ガイドの予定など"></textarea></label>
    <div class="actions">
      <button id="saveScheduleBtn" class="primary">保存</button>
    </div>
  </section>

  <section id="editor" class="panel hidden">
    <div class="panel-head">
      <h2>新規問い合わせ</h2>
      <button id="closeEditor" class="ghost">閉じる</button>
    </div>

    <label>問い合わせ内容をそのまま貼り付け</label>
    <textarea id="rawText" rows="10" placeholder="LINE・メール・SNSの内容をそのまま貼り付けてください"></textarea>

    <div class="actions">
      <button id="parseBtn" class="primary">AI整理（試作）</button>
      <button id="clearBtn" class="ghost">クリア</button>
    </div>

    <div id="parsedArea" class="hidden">
      <h3>整理結果</h3>
      <div class="grid">
        <label>代表者氏名<input id="name"></label>
        <label>電話<input id="phone"></label>
        <label>メール<input id="email"></label>
        <label>希望日<input id="desiredDate" type="date"></label>
        <label>人数<input id="people" type="number" min="1"></label>
        <label>ホテル<input id="hotel"></label>
        <label>観察したい生き物<input id="creatures" placeholder="例：ヘビ、カエル"></label>
        <label>問い合わせ方法
          <select id="contactMethod">
            <option>公式LINE</option><option>メール</option><option>電話</option><option>SNSのDM</option><option>SIMDEF</option>
          </select>
        </label>
      </div>

      <label>備考<textarea id="notes" rows="3" placeholder="アレルギー、特別なご要望、その他メモなど"></textarea></label>

      <label>不足している情報</label>
      <div id="missing" class="missing"></div>

      <h3>参加者情報（自動抽出・要確認）</h3>
      <p class="hint">メール本文から氏名・年齢・靴のサイズを検出できた場合、下に自動で入ります。うまく検出できなかった項目は手入力してください。</p>
      <div id="participantFieldsEditor"></div>

      <div class="availability">
        <h3>日程メモ</h3>
        <p>希望日が埋まっている場合の候補日を、ここで簡単に設定できます。</p>
        <div class="grid">
          <label>希望日の状態
            <select id="dateStatus">
              <option value="available">空き</option>
              <option value="booked">他のお客様のガイド</option>
              <option value="personal">自分の予定</option>
              <option value="closed">休業</option>
            </select>
          </label>
          <label>候補日1<input id="alt1" type="date"></label>
          <label>候補日2<input id="alt2" type="date"></label>
        </div>
      </div>

      <label>返信案</label>
      <textarea id="reply" rows="9"></textarea>
      <div class="actions">
        <button id="makeReply" class="secondary">返信案を作る</button>
        <button id="copyReply" class="ghost">返信をコピー</button>
        <button id="saveBtn" class="primary">この問い合わせを保存</button>
      </div>
    </div>
  </section>
</main>

<section id="detailModal" class="modal hidden">
  <div class="modal-box">
    <div class="panel-head">
      <h2 id="detailTitle"></h2>
      <button id="closeModal" class="ghost">閉じる</button>
    </div>
    <div id="detail"></div>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
