# Threads投稿の下書きをIssueに作るだけのワークフロー
# サイトのファイルは読むだけで、commit/pushは一切しない
name: Threads draft

# 定時実行はGitHubのscheduleではなく、外部タイマー(cron-job.org)からAPIで起動する
# (GitHubのscheduleは混雑時に数時間遅れるため、2026-09-25に廃止)
on:
  workflow_dispatch:
    inputs:
      post_type:
        description: "投稿タイプ(autoは曜日で自動)"
        type: choice
        options: [auto, creature, tip, quiz, tour]
        default: auto
      count:
        description: "作る下書きの数(2なら別の生き物・コツで2案)"
        type: choice
        options: ["2", "1"]
        default: "2"

permissions:
  issues: write      # Issue作成のみ
  contents: read     # ファイルは読むだけ(書き込み権限なし)

concurrency:
  group: threads-draft

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: threads/requirements.txt

      - run: pip install -r threads/requirements.txt

      - run: python threads/make_draft.py
        env:
          GEMINI_API_KEY: ${{ secrets.THREADS_GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POST_TYPE: ${{ inputs.post_type != 'auto' && inputs.post_type || '' }}
          DRAFT_COUNT: ${{ inputs.count || '2' }}
