name: process-creature-photos

on:
  push:
    paths:
      - "images/creatures/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-photos:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Arial-compatible font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation

          echo "Available Liberation Sans font files:"
          find /usr/share/fonts -type f \( \
            -iname "LiberationSans-Regular.ttf" \
            -o -iname "LiberationSans-Regular.otf" \
          \) -print

          font_path="$(find /usr/share/fonts -type f -iname "LiberationSans-Regular.ttf" -print -quit)"
          if [ -z "$font_path" ]; then
            echo "Liberation Sans Regular font was not found."
            exit 1
          fi

          mkdir -p "C:/Windows/Fonts"
          cp "$font_path" "C:/Windows/Fonts/arial.ttf"

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Process creature photos
        run: python scripts/process_creature_photos.py

      - name: Commit and push processed photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add images/creatures

          if git diff --cached --quiet; then
            echo "No files changed; nothing to commit."
            exit 0
          fi

          git commit -m "chore: process creature photos"
          git push
