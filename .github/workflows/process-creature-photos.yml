name: process-creature-photos

on:
  push:
    branches:
      - main
    paths:
      - "images/creatures/**"
  workflow_dispatch:

permissions:
  contents: write

# 写真を続けて送ったときに同時に動いてpushが行き違わないよう、1回ずつ順番に動かす
concurrency:
  group: process-creature-photos
  cancel-in-progress: false

jobs:
  process-photos:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Arial-compatible font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation

          echo "Available Liberation Sans font files:"
          find /usr/share/fonts -type f \( \
            -iname "LiberationSans-Regular.ttf" \
            -o -iname "LiberationSans-Regular.otf" \
          \) -print

          font_path="$(find /usr/share/fonts -type f -iname "LiberationSans-Regular.ttf" -print -quit)"
          if [ -z "$font_path" ]; then
            echo "Liberation Sans Regular font was not found."
            exit 1
          fi

          mkdir -p "C:/Windows/Fonts"
          cp "$font_path" "C:/Windows/Fonts/arial.ttf"

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Process creature photos
        run: python scripts/process_creature_photos.py

      - name: Regenerate site pages
        run: |
          python scripts/generate_creatures_json.py
          rm -rf creatures
          python scripts/generate_creature_pages.py
          python scripts/generate_category_pages.py
          python scripts/generate_zukan_page.py
          python scripts/generate_highlights_page.py
          rm -rf en/creatures es/creatures zh/creatures
          python scripts/generate_creature_pages_i18n.py
          python scripts/generate_creatures_json_i18n.py
          python scripts/generate_category_pages_i18n.py
          python scripts/generate_zukan_page_i18n.py
          python scripts/generate_highlights_page_i18n.py
          python scripts/generate_sitemap.py

      - name: Commit and push processed photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add images/creatures data/creatures.json data/creatures.en.json data/creatures.es.json data/creatures.zh.json creatures categories highlights.html en/creatures en/categories es/creatures es/categories zh/creatures zh/categories en/highlights.html es/highlights.html zh/highlights.html sitemap.xml

          if git diff --cached --quiet; then
            echo "No files changed; nothing to commit."
            exit 0
          fi

          git commit -m "chore: process creature photos"
          git pull --rebase origin main
          git push
