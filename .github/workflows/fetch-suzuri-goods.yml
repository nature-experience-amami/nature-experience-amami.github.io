name: fetch-suzuri-goods

# SUZURI の公開中のTシャツを取得して data/suzuri-products.json に保存する
# 中身は scripts/fetch_suzuri_goods.py。APIキーは Secrets の SUZURI_API_KEY
on:
  schedule:
    - cron: "17 19 * * *" # 毎日 日本時間 4:17（GitHub の cron は UTC）
  workflow_dispatch:
  # 作業用ブランチで取得の仕組みを直したときの試し運転（保存・commit はしない）。main に入れる前に消す
  push:
    branches:
      - claude/loving-pasteur-8eui3f
    paths:
      - ".github/workflows/fetch-suzuri-goods.yml"
      - "scripts/fetch_suzuri_goods.py"

permissions:
  contents: write

concurrency:
  group: fetch-suzuri-goods
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 書き込みできるトークンを .git/config に残さない（APIキーを使う手順と分けるため）
      # 写真（images/）は使わないので、要るフォルダだけを取ってくる（ルート直下のファイルも入る）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            data
          filter: blob:none

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch SUZURI T-shirts
        env:
          SUZURI_API_KEY: ${{ secrets.SUZURI_API_KEY }}
        run: python scripts/fetch_suzuri_goods.py

      # 保存は main で動いたときだけ。内容が変わった日だけ commit する
      - name: Commit and push
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/suzuri-products.json
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "SUZURIのTシャツ一覧を更新"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # 写真処理の workflow と同時に push したときは、取り込み直して3回までやり直す
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
