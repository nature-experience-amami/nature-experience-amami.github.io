name: creatures-json

on:
  push:
    paths:
      - 'images/creatures/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/generate_creatures_json.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/creatures.json
          git commit -m "auto: update creatures.json" || echo "no changes"
          git push
