<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nature Experience Amami｜奄美の森へ</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      background: #000;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      background-image: url("image.png");
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      overflow: hidden;
    }

    /* 写真を少し暗くして文字を見やすくする */
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
    }

    .hero-content {
      position: relative;
      z-index: 1;
      padding: 20px;
    }

    /* 最初は透明・少し下に配置 */
    .fade-in {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 2s ease forwards;
    }

    /* 順番に登場 */
    .welcome {
      font-size: clamp(1.2rem, 3vw, 2rem);
      letter-spacing: 0.15em;
      margin-bottom: 15px;
      animation-delay: 0.5s;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 8vw, 5.5rem);
      letter-spacing: 0.12em;
      margin-bottom: 25px;
      animation-delay: 1.2s;
    }

    .hero p {
      font-size: clamp(1.1rem, 3vw, 1.6rem);
      letter-spacing: 0.08em;
      margin-bottom: 40px;
      animation-delay: 2s;
    }

    .button {
      display: inline-block;
      padding: 15px 32px;
      background: rgba(255, 255, 255, 0.9);
      color: #222;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 2s ease forwards;
      animation-delay: 2.8s;
    }

    .button:hover {
      background: white;
      transform: scale(1.05);
    }

    /* 浮かび上がるアニメーション */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* スマホでは少し文字を小さく */
    @media (max-width: 600px) {
      .hero {
        background-position: center;
      }

      .hero-content {
        padding: 25px;
      }
    }
  </style>
</head>

<body>

  <section class="hero">

    <div class="hero-content">

      <div class="fade-in welcome">
        ようこそ
      </div>

      <h1 class="fade-in">
        奄美の森へ
      </h1>

      <p class="fade-in">
        生き物たちの時間が始まります。
      </p>

      <a href="#tour" class="button">
        🌙 ナイトツアーを見る
      </a>

    </div>

  </section>

  <section id="tour" style="padding: 80px 20px; background: white; text-align: center;">

    <h2>Nature Experience Amami</h2>

    <p style="margin-top: 20px;">
      奄美大島の豊かな自然を、一緒に探検しませんか？
    </p>

  </section>

</body>
</html>
