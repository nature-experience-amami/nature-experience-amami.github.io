<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トップ写真 明るさ60%｜Nature Experience Amami</title>
<style>
  html, body, iframe { width:100%; height:100%; margin:0; border:0; }
  iframe { display:block; }
</style>
</head>
<body>
<iframe id="top-page" src="../index.html" title="トップページ写真 明るさ60%"></iframe>
<script>
const topPage = document.getElementById("top-page");
topPage.addEventListener("load", () => {
  const style = topPage.contentDocument.createElement("style");
  style.textContent = ".hero-photo { filter: brightness(.60); }";
  topPage.contentDocument.head.append(style);
});
</script>
</body>
</html>
