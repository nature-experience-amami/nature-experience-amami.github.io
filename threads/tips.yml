    - kenaga-nezumi
    - id: amami-aka-gaeru        # アマミアカガエル
      months: [12, 1]
    - id: amami-ao-gaeru         # アマミアオガエル
      months: [1, 2, 3]
    - id: hanasaki-gaeru         # アマミハナサキガエル
      months: [12, 1]
    - id: haroweru-amagaeru      # ハロウェルアマガエル
      months: [3, 4, 5, 6]
    - id: hime-amagaeru          # ヒメアマガエル
      months: [3, 4, 5, 6, 7]
    - id: ishikawa-gaeru         # アマミイシカワガエル
      months: [12, 1, 2, 3]
    - id: otton-gaeru            # オットンガエル
      months: [7, 8]
    - id: ryukyu-kajika-gaeru    # リュウキュウカジカガエル
      months: [4, 5, 6, 7, 8, 9, 10]

- text: 昼間に生き物を探すなら鳥の声に注目。リュウキュウアカショウビン、アカヒゲ、リュウキュウサンコウチョウ、ルリカケスなど
  type: 楽しみ方
  creature:
    - ryukyu-akashobin
    - akahige
    - sankoutyou
    - ruri-kakesu

- text: オオトラツグミは早朝と夕方に鳴きます
  type: 楽しみ方
  creature: oo-tora-tsugumi
