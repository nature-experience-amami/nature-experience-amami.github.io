# ガイドの観察のコツ(ネタ帳)
# type: 安全 / マナー・保護 / 楽しみ方
# creature: 添える写真の生き物ID。コツに関係する生き物を指定する
#   - 1種だけなら  creature: habu
#   - 複数なら候補の中から1つ選ぶ:
#       creature:
#         - ruri-kakesu
#         - id: ryuukyuu-konohazuku
#           months: [4, 5, 6, 7]   # この月だけ候補にする(省略すると通年)
#   - 空欄、または候補が全部対象外の月は、季節の生き物からランダム
#     (その場合はコツと結びつけず「写真は○○」と紹介するだけ)

- text: 奄美の夜はハブやヒメハブなどの毒蛇に要注意
  type: 安全
  creature: habu

- text: 生き物の鳴き声や方向に敏感になろう
  type: 楽しみ方
  creature:   # カエル類の月はナイトツアーで鳴き声がよく聞こえる時期(現場の感覚。繁殖期とは別)
    - ryuukyuu-konohazuku
    - taiwan-kutsuwamushi
    - kenaga-nezumi
    - id: amami-aka-gaeru        # アマミアカガエル
      months: [12, 1]
    - id: amami-ao-gaeru         # アマミアオガエル
      months: [1, 2, 3]
    - id: hanasaki-gaeru         # アマミハナサキガエル
      months: [12, 1]
    - id: haroweru-amagaeru      # ハロウェルアマガエル
      months: [3, 4, 5, 6]
    - id: hime-amagaeru          # ヒメアマガエル
      months: [3, 4, 5, 6, 7]
    - id: ishikawa-gaeru         # アマミイシカワガエル
      months: [12, 1, 2, 3]
    - id: otton-gaeru            # オットンガエル
      months: [7, 8]
    - id: ryukyu-kajika-gaeru    # リュウキュウカジカガエル
      months: [4, 5, 6, 7, 8, 9, 10]

- text: 特別保護区内や天然記念物など、触ってはいけない場所や生き物がいます
  type: マナー・保護
  creature:

- text: 生き物の写真を撮る時は、なるべくその生き物の負担にならない様にしよう
  type: マナー・保護
  creature:

- text: ナイトツアーで山へ入る時は、生き物の棲家へお邪魔している
  type: マナー・保護
  creature:

- text: 林道を走る時は速度15km以下で走行しよう
  type: 安全
  creature:

- text: ナイトツアーで見た生き物のポイントは他の人に言わないで
  type: マナー・保護
  creature:

- text: 生き物に会ったら沢山写真を撮って、帰ったら図鑑などで調べてみよう
  type: 楽しみ方
  creature:

- text: 発生時期や繁殖時期、天候や気温によって観れる生き物が毎日変わります
  type: 楽しみ方
  creature:

- text: どんな所にどんな生き物がいるのか、周りの環境をよく観察してみよう
  type: 楽しみ方
  creature:

- text: ナイトツアーで聞こえる鳴き声は、リュウキュウコノハズクやタイワンクツワムシ、ケナガネズミ。カエル類は繁殖期によく鳴きます
  type: 楽しみ方
  creature:   # カエル類の月はナイトツアーで鳴き声がよく聞こえる時期(現場の感覚。繁殖期とは別)
    - ryuukyuu-konohazuku
