# 生き物ごとの上書き設定(サイト側のMarkdownは変更しない)
# ここに書いた内容は、Threads投稿の下書きを作るときだけMarkdownより優先される
# 値はすべてオーナーの現場の感覚で決めたもの
#
# 書き方:
#   生き物ID:
#     months: [5, 6, 7]   # 見られる時期。Markdownの months の代わりに使う(一年中は 1〜12 を全部書く)
#     tour_exclude: true  # 見るのが難しい種の印。ツアー案内では名前にも写真にも使わない
#     diurnal: true/false # (通常は書かない)昼行性の扱いをThreadsだけで変えたいときに使う
#   ※ tour_exclude の種も、生き物紹介・クイズには今まで通り出る
#
#   _categories: カテゴリー単位の既定値(Markdownに activity がない種だけに効く)。種ごとの値が優先
#
# 昼行性かどうかは、2026-09-24からサイト側のMarkdown(日本語版)で管理している:
#   activity: diurnal         → 昼行性。ツアー案内では名前にも写真にも使わない
#   night_observable: true    → 昼行性でも夜に観察できる(寝姿・越冬集団など)。ツアー案内に出る
# 新しい種(例: オキナワキノボリトカゲ・ヤモリ)のMarkdownを作るときは、そちらに書く

